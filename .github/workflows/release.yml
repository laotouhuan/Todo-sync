name: 'Publish Desktop and Android Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('windows/src-tauri/tauri.conf.json', 'utf8')).version;
          const android = fs.readFileSync('android/app/build.gradle.kts', 'utf8').match(/versionName\s*=\s*"([^"]+)"/);
          if (!android || android[1] !== version) throw new Error('Windows 与 Android 版本号不一致');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('发布标签与应用版本号不一致');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      # 签名文件只在临时 Runner 中恢复，不提交到仓库，也不上传为 Artifact。
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少 Android 签名 Secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/todo-release.keystore
          test -s android/app/todo-release.keystore

      - name: Test and build signed Release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease

      - name: Verify and name Android APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify "$APK"
          mkdir -p android-release
          cp "$APK" "android-release/Todo-${RELEASE_VERSION}-android.apk"

      - name: Save signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f android/app/todo-release.keystore

  publish-tauri:
    needs: publish-android
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd windows
          npm install

      # 注意：当前构建产物为未代码签名的安装包（Code Signing Certificate 需付费获取）。
      # 用户首次安装时 Windows SmartScreen 可能弹出警告，点击「仍要运行」即可正常安装。
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./windows"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract Version from Tauri Config
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename Windows Setup for Release
        shell: bash
        run: |
          mv -f windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.exe windows/src-tauri/target/release/bundle/nsis/Todo-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe
          if [ -f "windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.exe.sig" ]; then
            mv -f windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.exe.sig windows/src-tauri/target/release/bundle/nsis/Todo-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe.sig
          fi
          if [ -f "windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.nsis.zip" ]; then
            mv -f windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.nsis.zip windows/src-tauri/target/release/bundle/nsis/Todo-${{ steps.get_version.outputs.version }}-windows-x64-setup.nsis.zip
            mv -f windows/src-tauri/target/release/bundle/nsis/Todo_${{ steps.get_version.outputs.version }}_x64-setup.nsis.zip.sig windows/src-tauri/target/release/bundle/nsis/Todo-${{ steps.get_version.outputs.version }}-windows-x64-setup.nsis.zip.sig
          fi

      - name: Generate latest.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = require('./windows/src-tauri/tauri.conf.json').version;
            
            let signature = '';
            const exeSigPath = 'windows/src-tauri/target/release/bundle/nsis/Todo-' + version + '-windows-x64-setup.exe.sig';
            
            if (fs.existsSync(exeSigPath)) {
              signature = fs.readFileSync(exeSigPath, 'utf8').trim();
            }
            
            const data = {
              version: version,
              notes: 'Todo-sync v' + version + ' Release',
              pub_date: new Date().toISOString(),
              platforms: {
                'android-arm64': {
                  url: 'https://github.com/laotouhuan/Todo-sync/releases/download/v' + version + '/Todo-' + version + '-android.apk'
                },
                'windows-x86_64': {
                  signature: signature,
                  url: 'https://github.com/laotouhuan/Todo-sync/releases/download/v' + version + '/Todo-' + version + '-windows-x64-setup.exe'
                }
              }
            };
            fs.writeFileSync('latest.json', JSON.stringify(data, null, 2));
          "

      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: Verify Android release asset
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
          ANDROID_VERSION: ${{ needs.publish-android.outputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "$ANDROID_VERSION"
          test -s "android-release/Todo-${RELEASE_VERSION}-android.apk"

      - name: Create Release and Upload Windows and Android Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: 'Todo-sync ${{ steps.get_version.outputs.tag_name }}'
          body: 'Todo-sync ${{ steps.get_version.outputs.tag_name }} Release.'
          draft: false
          # workflow_dispatch 手动触发时若 tag 不存在则自动创建
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            windows/src-tauri/target/release/bundle/nsis/Todo-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe
            android-release/Todo-${{ steps.get_version.outputs.version }}-android.apk
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
